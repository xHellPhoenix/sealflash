# Cargo-Workspace: mehrere Rust-Crates teilen sich ein Cargo.lock und ein target/-Verzeichnis.
#   crates/sealflash-core  -> die eigentliche Logik (Katalog, Download, Flashen ...), OHNE Tauri
#   src-tauri              -> die Desktop-App (dünne Schicht: Tauri-Commands + Events)
# Später kommt noch ein kleiner Flash-Helper dazu (läuft unter Linux via pkexec mit Root-Rechten).
[workspace]
resolver = "3"
members = ["crates/sealflash-core", "crates/sealflash-flash-helper", "src-tauri"]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/xHellPhoenix/sealflash"
authors = ["xHellPhoenix"]
rust-version = "1.90"

[workspace.dependencies]
sealflash-core = { path = "crates/sealflash-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
url = { version = "2", features = ["serde"] }
schemars = "1"
# HTTP-Client. Standard-TLS ist in 0.13 rustls (in Rust geschrieben) statt OpenSSL:
# gleiches Verhalten unter Windows und Linux, keine OpenSSL-Version, die zur Distro passen muss.
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
percent-encoding = "2"
sha2 = "0.11"
md-5 = "0.11"
# gzip im Fluss entpacken (Batocera .img.gz) – reine Rust-Implementierung (miniz_oxide)
flate2 = "1"
# xz: liblzma 5.2 wird mitkompiliert (nicht die 5.6.0/5.6.1 mit der Hintertür von 2024).
xz2 = { version = "0.1", features = ["static"] }
# zstd: reiner Rust-Decoder, kein C-Compiler nötig.
ruzstd = "0.8"
# GPT braucht CRC32 (Header und Partitionseinträge)
crc32fast = "1"
# Nur in Tests: unabhängiger FAT32-Leser zur Gegenprobe (zum Schreiben ungeeignet, siehe fat32.rs)
fatfs = "0.3"
libc = "0.2"
# OpenPGP ohne Standard-Features: das Krypto-Backend wählt jedes Crate pro Betriebssystem selbst.
sequoia-openpgp = { version = "2", default-features = false }

# Abhängigkeiten (Hashing, Krypto, Entpacken) auch im Debug-Build optimieren.
# Ohne das hasht `cargo run`/`tauri dev` nur ~15 MB/s statt mehreren 100 MB/s.
# Unser eigener Code bleibt unoptimiert: schnelles Neukompilieren und besseres Debugging.
[profile.dev.package."*"]
opt-level = 2
